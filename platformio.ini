; M5Stack StopWatch (C152) - Father-Son Dual-Timezone Watch
; MCU: ESP32-S3R8 | 16MB flash | 8MB PSRAM (OPI)
; Display: 1.75" round AMOLED 466x466 (CO5300) | Touch: CST820B
; IMU: BMI270 | RTC: RX8130CE | Codec: ES8311

[env:m5stopwatch]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ── flash / psram for the StopWatch's ESP32-S3R8 ─────────
; M5GFX's autodetect requires OPI PSRAM enabled. On Arduino-ESP32 this is
; selected via the prebuilt core variant `qio_opi` (QIO flash + OPI PSRAM).
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; ── USB-CDC for Serial monitor over Type-C ───────────────
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include

; ── libraries ────────────────────────────────────────────
lib_deps =
    m5stack/M5Unified @ ^0.2.5
    m5stack/M5GFX     @ ^0.2.6
    lvgl/lvgl         @ ^9.2.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson  @ ^7.2.1

; ── upload & monitor ─────────────────────────────────────
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
